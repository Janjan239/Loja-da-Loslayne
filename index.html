<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loja da Loslayne</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    font-size: 28px;
}

header p {
    margin-top: 8px;
    color: #ddd;
}

.banner {
    background: #e8e8e8;
    text-align: center;
    padding: 40px 20px;
}

.banner h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px 15px;
}

.container h2 {
    text-align: center;
    margin-bottom: 20px;
}

.produtos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.produto {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px #0002;
}

.produto img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.info {
    padding: 15px;
}

.info h3 {
    margin-bottom: 8px;
}

.preco {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    background: #111;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.carrinho {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.carrinho h2 {
    margin-bottom: 15px;
}

#listaCarrinho {
    margin-bottom: 15px;
}

.item {
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.total {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.whatsapp {
    display: block;
    background: #25D366;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
}

footer {
    margin-top: 30px;
    background: #111;
    color: white;
    text-align: center;
    padding: 25px;
}

@media (max-width: 600px) {
    .produtos {
        grid-template-columns: 1fr 1fr;
    }

    .produto img {
        height: 160px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Loja da Loslayne 👗</h1>
    <p>Moda, estilo e qualidade</p>
</header>

<section class="banner">
    <h2>Nova coleção 🔥</h2>
    <p>Escolha seus favoritos!</p>
</section>

<div class="container">

<h2>Produtos</h2>

<div class="produtos">

<div class="produto">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80">

<div class="info">
<h3>Camiseta Básica</h3>
<p class="preco">R$ 49,90</p>

<button onclick="adicionar('Camiseta Básica', 49.90)">
Adicionar ao carrinho
</button>
</div>
</div>

<div class="produto">
<img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=600&q=80">

<div class="info">
<h3>Camisa Estilosa</h3>
<p class="preco">R$ 79,90</p>

<button onclick="adicionar('Camisa Estilosa', 79.90)">
Adicionar ao carrinho
</button>
</div>
</div>

<div class="produto">
<img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=600&q=80">

<div class="info">
<h3>Blusa Feminina</h3>
<p class="preco">R$ 69,90</p>

<button onclick="adicionar('Blusa Feminina', 69.90)">
Adicionar ao carrinho
</button>
</div>
</div>

</div>

<div class="carrinho">

<h2>🛒 Meu carrinho</h2>

<div id="listaCarrinho">
Seu carrinho está vazio.
</div>

<div class="total">
Total: R$ <span id="total">0,00</span>
</div>

<a id="whatsapp"
class="whatsapp"
href="#"
target="_blank">

Finalizar pedido pelo WhatsApp 📲

</a>

</div>

</div>

<footer>
<p>© 2026 Loja da Loslayne</p>
</footer>

<script>

let carrinho = [];

function adicionar(nome, preco) {

    carrinho.push({
        nome: nome,
        preco: preco
    });

    atualizar();

}

function atualizar() {

    let lista = document.getElementById("listaCarrinho");
    let total = 0;

    if (carrinho.length === 0) {

        lista.innerHTML = "Seu carrinho está vazio.";

    } else {

        lista.innerHTML = "";

        carrinho.forEach((produto) => {

            total += produto.preco;

            lista.innerHTML += `
            <div class="item">
            ${produto.nome} - R$ ${produto.preco.toFixed(2).replace(".", ",")}
            </div>
            `;

        });

    }

    document.getElementById("total").innerText =
        total.toFixed(2).replace(".", ",");

    let mensagem = "Olá! Quero fazer um pedido:\n\n";

    carrinho.forEach(produto => {

        mensagem +=
        "- " + produto.nome +
        " - R$ " +
        produto.preco.toFixed(2).replace(".", ",") +
        "\n";

    });

    mensagem +=
    "\nTotal: R$ " +
    total.toFixed(2).replace(".", ",");

    document.getElementById("whatsapp").href =
        "https://wa.me/5598989183658?text=" +
        encodeURIComponent(mensagem);

}

</script>

</body>
    </html>
