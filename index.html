<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minha Loja</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 30px;
}

.banner {
    background: #ddd;
    padding: 45px 20px;
    text-align: center;
}

.banner h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.produtos {
    padding: 25px 15px;
    max-width: 1000px;
    margin: auto;
}

.produtos h2 {
    text-align: center;
    margin-bottom: 25px;
}

.lista {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.produto {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.produto img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.info {
    padding: 15px;
}

.info h3 {
    margin-bottom: 8px;
}

.preco {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.botao {
    display: block;
    background: #25D366;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
}

footer {
    margin-top: 30px;
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

@media (max-width: 600px) {

    .produto img {
        height: 180px;
    }

}

</style>

</head>

<body>

<header>

<h1>MINHA LOJA 👕</h1>

<p>Moda e estilo</p>

</header>

<section class="banner">

<h2>Nova coleção 🔥</h2>

<p>Confira nossas roupas!</p>

</section>

<section class="produtos">

<h2>Produtos</h2>

<div class="lista">

<div class="produto">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80">

<div class="info">

<h3>Camiseta Básica</h3>

<p class="preco">R$ 49,90</p>

<a
class="botao"
href="https://wa.me/5500000000000"
target="_blank">

Comprar pelo WhatsApp

</a>

</div>

</div>


<div class="produto">

<img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=600&q=80">

<div class="info">

<h3>Camisa Estilosa</h3>

<p class="preco">R$ 79,90</p>

<a
class="botao"
href="https://wa.me/5500000000000"
target="_blank">

Comprar pelo WhatsApp

</a>

</div>

</div>

</div>

</section>

<footer>

<p>© 2026 Minha Loja</p>

<p>Entre em contato conosco 📲</p>

</footer>

</body>

</html>
